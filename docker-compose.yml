# Chạy toàn bộ TutorHub: docker compose up --build
#   Web:      http://localhost:5173
#   API:      http://localhost:9090/api   (Swagger: /api/docs)
# Cấu hình lấy từ file .env cạnh file này (copy từ .env.example)
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-tutorhub}
      MYSQL_USER: ${DB_USER:-tutorhub}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      FRONTEND_URL: http://localhost:5173
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:9090}
    volumes:
      - uploads:/app/uploads
    ports:
      - "9090:9090"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  uploads:
